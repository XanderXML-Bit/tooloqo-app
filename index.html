    <!-- Typography: Space Grotesk (display) and JetBrains Mono are self-hosted via @fontsource (src/main.tsx); Geist (body) below -->
    <!-- Geist font from Vercel -->
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/Geist-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>


    <style>
      /* ========================================
         TOOLOQO - PRECISION TOOLS DESIGN SYSTEM
         Modern utility toolkit with distinctive brand
         ======================================== */

      /* === CSS Custom Properties === */
      :root {
        /* Light Mode Colors */
        --color-background: #f8fafc;
        --color-surface: #ffffff;
        --color-surface-elevated: #ffffff;
        --color-surface-highlight: #f1f5f9;
        --color-surface-overlay: rgba(255, 255, 255, 0.9);

        --color-text-primary: #0f172a;
        --color-text-secondary: #475569;
        --color-text-tertiary: #5f6b7d; /* 4.9:1 on surfaces (WCAG AA) */
        --color-text-inverse: #f8fafc;

        --color-border: rgba(0, 0, 0, 0.08);
        --color-border-focus: rgba(51, 120, 255, 0.4);

        /* Gradients */
        --gradient-primary: linear-gradient(135deg, #3378ff 0%, #5c9aff 100%);
        --gradient-premium: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
        --gradient-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.95) 100%);
        --gradient-glow: radial-gradient(ellipse at 50% 0%, rgba(51, 120, 255, 0.08) 0%, transparent 70%);

        /* Safe Areas */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      .dark {
        /* Dark Mode Colors - Precision Tools */
        --color-background: #08090d;
        --color-surface: #0f1117;
        --color-surface-elevated: #181b24;
        --color-surface-highlight: #242936;
        --color-surface-overlay: rgba(15, 17, 23, 0.95);

        --color-text-primary: #f8fafc;
        --color-text-secondary: #94a3b8;
        --color-text-tertiary: #8b98ad; /* 5:1 on surface-highlight (WCAG AA) */
        --color-text-inverse: #0f172a;

        --color-border: rgba(255, 255, 255, 0.06);
        --color-border-focus: rgba(51, 120, 255, 0.5);

        /* Dark Gradients */
        --gradient-surface: linear-gradient(180deg, rgba(24, 27, 36, 0.8) 0%, rgba(15, 17, 23, 0.95) 100%);
        --gradient-glow: radial-gradient(ellipse at 50% 0%, rgba(51, 120, 255, 0.12) 0%, transparent 70%);
      }

      /* === Base Styles === */
      html, body {
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        font-family: 'Geist', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        letter-spacing: -0.01em;
      }

      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        background-color: var(--color-background);
        color: var(--color-text-primary);
      }

      /* Allow text selection in inputs */
      input, textarea, .selectable-text, [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }

      /* Remove tap highlight */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* === Typography Scale === */
      .font-display { font-size: 2.25rem; line-height: 1.2; letter-spacing: -0.03em; font-weight: 700; }
      .font-h1 { font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.02em; font-weight: 600; }
      .font-h2 { font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.01em; font-weight: 600; }
      .font-h3 { font-size: 1.125rem; line-height: 1.4; font-weight: 500; }
      .font-body { font-size: 0.9375rem; line-height: 1.5; }
      .font-sm { font-size: 0.8125rem; line-height: 1.5; }
      .font-xs { font-size: 0.75rem; line-height: 1.4; }
      .font-xxs { font-size: 0.6875rem; line-height: 1.3; letter-spacing: 0.04em; text-transform: uppercase; }

      /* === Safe Area Utilities === */
      .pt-safe { padding-top: var(--safe-top); }
      .pb-safe { padding-bottom: var(--safe-bottom); }
      .pl-safe { padding-left: var(--safe-left); }
      .pr-safe { padding-right: var(--safe-right); }
      .safe-area-top { padding-top: max(var(--safe-top), 12px); }
      .safe-area-bottom { padding-bottom: max(var(--safe-bottom), 12px); }

      /* === Scrollbar === */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .dark ::-webkit-scrollbar { width: 6px; height: 6px; }
      .dark ::-webkit-scrollbar-track { background: var(--color-surface); }
      .dark ::-webkit-scrollbar-thumb {
        background: var(--color-surface-highlight);
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* === Focus States === */
      *:focus-visible {
        outline: 2px solid rgba(51, 120, 255, 0.5);
        outline-offset: 2px;
      }

      /* === Gradient Utilities === */
      .bg-gradient-primary { background: var(--gradient-primary); }
      .bg-gradient-premium { background: var(--gradient-premium); }
      .bg-gradient-surface { background: var(--gradient-surface); }
      .bg-gradient-glow { background: var(--gradient-glow); }

      /* === Glass Effect === */
      .glass {
        background: var(--gradient-surface);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
      }

      /* === Tool Category Backgrounds === */
      .bg-tool-image-soft { background: rgba(59, 130, 246, 0.08); }
      .bg-tool-pdf-soft { background: rgba(239, 68, 68, 0.08); }
      .bg-tool-media-soft { background: rgba(168, 85, 247, 0.08); }
      .bg-tool-text-soft { background: rgba(34, 197, 94, 0.08); }

      /* === Animation Stagger Delays === */
      .stagger-1 { animation-delay: 50ms; }
      .stagger-2 { animation-delay: 100ms; }
      .stagger-3 { animation-delay: 150ms; }
      .stagger-4 { animation-delay: 200ms; }
      .stagger-5 { animation-delay: 250ms; }
      .stagger-6 { animation-delay: 300ms; }
      .stagger-7 { animation-delay: 350ms; }
      .stagger-8 { animation-delay: 400ms; }

      /* === Interactive States === */
      .press-effect {
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .press-effect:active {
        transform: scale(0.97);
      }

      .hover-lift {
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      }
      .hover-lift:hover {
        transform: translateY(-2px);
      }

      /* === Glow Effects === */
      .glow-primary { box-shadow: 0 0 24px rgba(51, 120, 255, 0.25); }
      .glow-accent { box-shadow: 0 0 24px rgba(251, 191, 36, 0.25); }
      .glow-success { box-shadow: 0 0 24px rgba(34, 197, 94, 0.25); }
      .glow-error { box-shadow: 0 0 24px rgba(239, 68, 68, 0.25); }

      /* === Corner Accents (drag states) === */
      .corner-accent {
        position: absolute;
        width: 1.25rem;
        height: 1.25rem;
        border-color: #3378ff;
      }
      .corner-accent-tl { top: 0.5rem; left: 0.5rem; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 6px; }
      .corner-accent-tr { top: 0.5rem; right: 0.5rem; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 6px; }
      .corner-accent-bl { bottom: 0.5rem; left: 0.5rem; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 6px; }
      .corner-accent-br { bottom: 0.5rem; right: 0.5rem; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 6px; }

      /* === Noise Texture Overlay === */
      .noise-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.015;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }

      /* === Accessibility: Reduced Motion === */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* === Ambient Background Effects === */
      .ambient-glow {
        position: absolute;
        pointer-events: none;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
      }

      .ambient-glow-primary {
        background: radial-gradient(circle, rgba(51, 120, 255, 0.3) 0%, transparent 70%);
      }

      .ambient-glow-accent {
        background: radial-gradient(circle, rgba(251, 191, 36, 0.2) 0%, transparent 70%);
      }
    </style>
  </head>
  <body class="bg-background text-text-primary h-screen w-screen overflow-hidden select-none touch-manipulation transition-colors duration-300">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
