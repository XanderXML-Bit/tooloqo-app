<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08090d" />
    <title>Page not found · Tooloqo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh; display: flex; flex-direction: column;
        background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(51, 120, 255, 0.12), transparent), #08090d;
        color: #f1f5f9; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      .box { max-width: 24rem; }
      img { width: 48px; height: 48px; opacity: 0.5; }
      h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 3.75rem; margin: 24px 0 8px; color: #94a3b8; }
      h2 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 1.125rem; margin: 0 0 8px; }
      p { color: #cbd5e1; font-size: 0.875rem; margin: 0 0 32px; }
      a.btn {
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px;
        border-radius: 12px; background: #1a5cf5; color: #fff; font-weight: 600; text-decoration: none;
      }
      a.btn:hover { background: #1449e1; }
      a:focus-visible { outline: 2px solid #8ec0ff; outline-offset: 2px; }
      footer { padding: 24px 16px; text-align: center; font-size: 0.75rem; color: #cbd5e1; }
      footer a { color: inherit; }
      footer p { margin: 0 0 8px; color: inherit; font-size: inherit; }
    </style>
  </head>
  <body>
    <main>
      <div class="box">
        <img src="/brand/mark.svg" alt="" />
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a class="btn" href="/">Go to Tooloqo</a>
      </div>
    </main>
    <footer>
      <p>© <span id="y">2026</span> Zendren · Built by <a href="https://xandermlopez.com" rel="author">Xander M. Lopez</a></p>
      <p><a href="https://zendren.net">zendren.net</a> · <a href="/privacy">Privacy</a></p>
    </footer>
    <script>document.getElementById('y').textContent = String(new Date().getFullYear());</script>
  </body>
</html>
